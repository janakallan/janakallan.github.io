<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>স্টাফ পোর্টাল • জনকল্যাণ ডায়াগনস্টিক</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#0f766e;--pri2:#0b3d3a;--bg:#eef5f4;--card:#fff;--tx:#1b2b28;--mut:#5f706b;--line:#d5e3e0;--err:#b42318;--ok:#067647;--warnbg:#fff3d6;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a19;--card:#15292a;--tx:#e6f1ef;--mut:#9db5b0;--line:#27403f;--err:#ff8a80;--ok:#6ee7a8}}
*{box-sizing:border-box}
body{margin:0;font-family:"Hind Siliguri","Noto Sans Bengali",Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.top{text-align:center;margin:8px 0 18px}
.top img{width:84px;height:84px;border-radius:50%;border:3px solid var(--pri);background:#fff;object-fit:cover;display:block;margin:0 auto 10px}
.top h1{font-size:19px;margin:0 0 4px;color:var(--pri)}
.top p{margin:0;color:var(--mut);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:18px}
.card p.s{margin:0 0 14px;color:var(--mut);font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 6px}
input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--tx)}
input:focus{outline:none;border-color:var(--pri)}
#otp{letter-spacing:8px;text-align:center;font-size:24px;font-weight:700}
button{font:inherit;font-weight:600;font-size:16px;width:100%;padding:13px;border-radius:12px;border:0;background:var(--pri);color:#fff;margin-top:14px;cursor:pointer}
button.alt{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
button:disabled{opacity:.55}
.msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--err)}
.msg.ok{color:var(--ok)}
.links{display:flex;justify-content:space-between;gap:10px}
.links button{margin-top:10px}
.who{display:flex;gap:12px;align-items:center}
.who img{width:56px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.who b{font-size:18px;display:block}
.who span{color:var(--mut);font-size:14px}
.note{color:var(--mut);font-size:13px;margin:10px 0 0}
#doc{margin-top:6px}
[hidden]{display:none!important}
.certwrap{overflow:auto}
@media screen and (max-width:760px){.certwrap .cert{zoom:.46}}
    /* ---------- স্টাফ কার্ড ও সনদ ---------- */
    #docPrint { display: none }
    .sthumb { width: 34px; height: 42px; object-fit: cover; border-radius: 4px; vertical-align: middle; margin-right: 8px; border: 1px solid var(--line) }
    .sbadge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--warnbg) !important; color: var(--warn) !important; margin-left: 6px }
    .idwrap, .idrow { display: flex; gap: 6mm; flex-wrap: wrap }
    .idwrap { overflow: auto; padding: 4px 0 8px }
    .certwrap { overflow: auto }
    .idc, .cert { -webkit-print-color-adjust: exact; print-color-adjust: exact }

    /* --- আইডি কার্ড --- */
    .idc { position: relative; width: 85.6mm; height: 54mm; box-sizing: border-box; border-radius: 3mm; overflow: hidden; background: #fff !important; color: #1b2b28 !important; border: .3mm solid #0f766e; font-family: "Hind Siliguri","Noto Sans Bengali",Arial,sans-serif; font-size: 8pt; line-height: 1.3; flex: none; display: flex; flex-direction: column }
    .ic-top { position: relative; height: 16mm; flex: none; display: flex; align-items: center; gap: 2.5mm; padding: 0 4mm; background: linear-gradient(120deg, #0b3d3a, #0f766e 60%, #1fb5a4) !important; color: #fff !important; overflow: hidden }
    .ic-top::after { content: ""; position: absolute; right: -8mm; top: -11mm; width: 30mm; height: 30mm; border-radius: 50%; background: rgba(255,255,255,.1) !important}
    .ic-top::before { content: ""; position: absolute; right: 8mm; bottom: -12mm; width: 20mm; height: 20mm; border-radius: 50%; background: rgba(255,255,255,.07) !important}
    .ic-top.sm { height: 10mm }
    .ic-logo { width: 11.5mm; height: 11.5mm; flex: none; position: relative; z-index: 1 }
    .ic-top.sm .ic-logo { width: 7mm; height: 7mm }
    .ic-logo svg { width: 100%; height: 100%; display: block }
    .ic-ttl { position: relative; z-index: 1; line-height: 1.15 }
    .ic-ttl b { display: block; font-size: 11pt; letter-spacing: .3mm; color: #fff !important}
    .ic-ttl span { display: block; font-size: 6.5pt; color: #e2f5f2 !important}
    .ic-ttl small { display: block; font-size: 6pt; color: #bfe8e2 !important}
    .ic-body { display: flex; gap: 3mm; padding: 0 4mm; flex: 1; min-height: 0; position: relative }
    .ic-body::after { content: ""; position: absolute; right: -6mm; bottom: -6mm; width: 24mm; height: 24mm; border-radius: 50%; background: #e9f4f2 !important}
    .ic-ph { width: 21.5mm; height: 27mm; margin-top: 2.5mm; flex: none; border: .9mm solid #fff; outline: .3mm solid #0f766e; border-radius: 2mm; background: #e6f3f1 !important; overflow: hidden; position: relative; z-index: 2 }
    .ic-ph img { width: 100%; height: 100%; object-fit: cover; display: block }
    .ic-ph0 { font-size: 7pt; color: #777 !important; text-align: center; padding-top: 10mm }
    .ic-info { padding-top: 3mm; min-width: 0; flex: 1; position: relative; z-index: 1 }
    .ic-name { font-size: 11.5pt; font-weight: 700; color: #0b3d3a !important; line-height: 1.2 }
    .ic-role { display: inline-block; margin: 1mm 0 1.6mm; padding: .3mm 2.6mm; border-radius: 99px; background: #0f766e !important; color: #fff !important; font-size: 7pt }
    .ic-row { font-size: 7.5pt; display: flex; gap: 1.5mm; margin-top: .7mm }
    .ic-row i { font-style: normal; color: #5f706b !important; min-width: 11mm }
    .ic-row b { color: #0b3d3a !important}
    .ic-bar { flex: none; height: 5mm; display: flex; align-items: center; justify-content: center; font-size: 6.5pt; font-weight: 600; letter-spacing: .4mm; background: linear-gradient(90deg, #b8893b, #e3c27a, #b8893b) !important; color: #3b2a08 !important; position: relative; z-index: 1 }
    .ic-det { flex: 1; padding: 2.4mm 4mm 0; display: grid; gap: 1.1mm; align-content: start; font-size: 7.5pt }
    .ic-det div { display: flex; gap: 2mm; border-bottom: .2mm dotted #9bb8b3; padding-bottom: .5mm }
    .ic-det i { min-width: 15mm; color: #5f706b !important; font-style: normal }
    .ic-det b { color: #0b3d3a !important}
    .ic-sig { padding: 0 4mm 1.2mm; display: flex; justify-content: flex-end }
    .ic-sig span { border-top: .25mm solid #1b2b28; padding-top: .5mm; font-size: 6.5pt; min-width: 30mm; text-align: center }

    /* --- সনদ --- */
    .cert { position: relative; box-sizing: border-box; width: 186mm; height: 266mm; margin: 0 auto; padding: 5mm; background: #fffdf6 !important; color: #1b2b28 !important; border: 1.6mm solid #0f766e; font-family: Georgia,"Times New Roman","Noto Serif Bengali","Hind Siliguri",serif; font-size: 12.5pt; line-height: 1.9; overflow: hidden }
    .ce-in { position: relative; box-sizing: border-box; height: 100%; border: .35mm solid #b8893b; padding: 8mm 13mm 7mm; display: flex; flex-direction: column }
    .ce-in > *:not(.co):not(.ce-wm) { position: relative; z-index: 1 }
    .co { position: absolute; width: 3.4mm; height: 3.4mm; background: #b8893b !important; transform: rotate(45deg) }
    .co.c1 { left: -1.9mm; top: -1.9mm } .co.c2 { right: -1.9mm; top: -1.9mm } .co.c3 { left: -1.9mm; bottom: -1.9mm } .co.c4 { right: -1.9mm; bottom: -1.9mm }
    .ce-wm { position: absolute; left: 50%; top: 52%; width: 115mm; height: 115mm; margin: -57mm 0 0 -57mm; opacity: .07; z-index: 0 }
    .ce-wm svg { width: 100%; height: 100%; display: block }
    .ce-head { text-align: center }
    .ce-logo { width: 22mm; height: 22mm; margin: 0 auto 1mm }
    .ce-logo img, .ce-wm img, .ic-logo img { width: 100%; height: 100%; border-radius: 50%; display: block; object-fit: cover }
    .ce-logo img { border: .6mm solid #b8893b; box-sizing: border-box }
    .ic-logo img { border: .3mm solid #fff; box-sizing: border-box }
    .ce-logo svg { width: 100%; height: 100%; display: block }
    .ce-head h1 { margin: 0; font-family: Georgia,"Times New Roman","Noto Serif Bengali",serif; font-size: 19pt; line-height: 1.3; color: #0b3d3a !important}
    .ce-head div { font-size: 10pt; color: #5f706b !important; line-height: 1.5 }
    .ce-div { display: flex; align-items: center; gap: 3mm; margin: 2mm 0 3mm }
    .ce-div::before, .ce-div::after { content: ""; flex: 1; height: .35mm; background: #b8893b !important}
    .ce-div i { width: 2.6mm; height: 2.6mm; background: #b8893b !important; transform: rotate(45deg) }
    .ce-title { text-align: center; margin: 0 0 4mm }
    .ce-title span { display: inline-block; padding: 1.6mm 14mm; border-radius: 1.5mm; background: linear-gradient(90deg, #0b3d3a, #0f766e, #0b3d3a) !important; color: #fff !important; font-family: Georgia,"Times New Roman","Noto Serif Bengali",serif; font-size: 17pt; line-height: 1.5; border-bottom: .8mm solid #b8893b }
    .ce-title small { display: block; margin-top: 1.5mm; font-size: 9pt; letter-spacing: 1.6mm; color: #b8893b !important; line-height: 1.2 }
    .ce-meta { display: flex; justify-content: space-between; font-size: 11pt; margin-bottom: 4mm; color: #3d4f4a !important; line-height: 1.5 }
    .ce-meta b { color: #0b3d3a !important}
    .ce-body { font-size: 11.5pt; line-height: 1.5 }
    .ce-body p { margin: 0 0 3mm; text-align: justify }
    .cph { float: right; width: 28mm; height: 35mm; object-fit: cover; background: #fff !important; padding: 1mm; border: .8mm solid #b8893b; margin: 0 0 3mm 7mm; box-sizing: border-box }
    .ce-name { font-family: Georgia,"Times New Roman","Noto Serif Bengali",serif; font-size: 16pt; color: #0b3d3a !important; border-bottom: .4mm solid #b8893b; padding: 0 1mm }
    .ce-strip { clear: both; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; margin-top: 2mm }
    .ce-strip div { background: #e9f4f2 !important; border: .3mm solid #0f766e; border-radius: 1.5mm; text-align: center; padding: 1.5mm 2mm; line-height: 1.5 }
    .ce-strip small { display: block; font-size: 9pt; color: #5f706b !important}
    .ce-strip b { font-size: 11.5pt; color: #0b3d3a !important}
    .ce-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end }
    .ce-seal { width: 24mm; height: 24mm; border: .4mm dashed #b8893b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9pt; color: #b8893b !important; text-align: center; line-height: 1.3 }
    .ce-sign { text-align: center }
    .ce-sign span { display: block; min-width: 48mm; border-top: .35mm solid #1b2b28; padding-top: 1mm; font-size: 11pt; line-height: 1.5 }
    .ce-addr { text-align: center; font-size: 9pt; color: #5f706b !important; margin-top: 4mm; border-top: .3mm solid #d9c79a; padding-top: 2mm; line-height: 1.4 }
    @media screen and (max-width: 760px) { #vbox .certwrap .cert { zoom: .46 } }
    @media print {
      body.pd main, body.pd .pane, body.pd .pane.on, body.pd #printHead, body.pd #noticePrint { display: none !important }
      body.pd #docPrint { display: block !important }
      .cert { margin: 0 }
    }


@media print{
  body{background:#fff;padding:0}
  .noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  #s3{background:none;border:0;padding:0;margin:0}
  .certwrap{overflow:visible}
  .certwrap .cert{zoom:1!important}
  @page{margin:12mm}
}
</style>

<body>
<main class="wrap">
  <header class="top noprint">
    <img id="lg" alt="">
    <h1>জনকল্যাণ ডায়াগনস্টিক এন্ড ডক্টর'স চেম্বার</h1>
    <p>স্টাফ পোর্টাল — আপনার আইডি কার্ড ও সনদ</p>
  </header>

  <section class="card noprint" id="s1">
    <h2>মোবাইল নাম্বার দিন</h2>
    <p class="s">প্রতিষ্ঠানে দেওয়া আপনার মোবাইল নাম্বারে একটা OTP কোড যাবে।</p>
    <label for="ph">মোবাইল নাম্বার</label>
    <input id="ph" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01XXXXXXXXX">
    <button id="b1">OTP পাঠান</button>
    <div class="msg" id="m1" role="alert"></div>
  </section>

  <section class="card noprint" id="s2" hidden>
    <h2>OTP কোড লিখুন</h2>
    <p class="s" id="s2t"></p>
    <label for="otp">৬ সংখ্যার কোড</label>
    <input id="otp" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
    <button id="b2">যাচাই করুন</button>
    <div class="msg" id="m2" role="alert"></div>
    <div class="links"><button class="alt" id="resend" disabled>আবার OTP পাঠান</button><button class="alt" id="chg">নাম্বার বদলান</button></div>
  </section>

  <section class="card" id="s3" hidden>
    <div class="noprint">
      <div class="who"><img id="wp" alt=""><div><b id="wn"></b><span id="wr"></span></div></div>
      <p class="note" id="wk"></p>
      <button id="pr">প্রিন্ট / PDF সংরক্ষণ করুন</button>
      <button class="alt" id="lo">বের হয়ে যান</button>
      <p class="note">প্রিন্ট স্ক্রিনে "PDF হিসেবে সংরক্ষণ" বা "Save as PDF" বেছে নিলে ফাইল হিসেবে রাখা যাবে।</p>
    </div>
    <div id="doc"></div>
  </section>
</main>

const decipher=s=>{if(!s)return"";try{const raw=decodeURIComponent(atob(s));let o="";for(let i=0;i<raw.length;i++)o+=String.fromCharCode(raw.charCodeAt(i)^VAULT_SALT.charCodeAt(i%VAULT_SALT.length));return o}catch(e){return s}};

function rateOK(key){
  let rl={};try{rl=JSON.parse(localStorage.getItem("otpRL")||"{}")}catch(e){}

  if(arr.length>=3)return false;
  arr.push(now);rl[key]=arr;try{localStorage.setItem("otpRL",JSON.stringify(rl))}catch(e){}
  return true;
}

}
async function smsSend(q,to,text){
  const base=(q.baseUrl||"https://api.qsms.com.bd/v1").replace(/\/+$/,"");
  let url=base+"/sms/send";
  if(q.corsRelay){const relay=q.corsRelay.includes("?")?q.corsRelay:q.corsRelay+"?url=";url=relay+encodeURIComponent(url)}
  const body={recipient:to,message:text};if(q.senderId)body.sender_id=q.senderId;
  try{
    const r=await fetch(url,{method:"POST",headers:{"Accept":"application/json","Content-Type":"application/json","X-API-KEY":decipher(q.encKey),"X-API-SECRET":decipher(q.encSecret)},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>null);
    if(r.ok&&j&&(j.status==="success"||j.data))return{ok:true};
    return{ok:false,msg:"SMS পাঠানো যায়নি। কিছুক্ষণ পরে আবার চেষ্টা করুন।"};
  }catch(e){return{ok:false,msg:"SMS পাঠানো যায়নি। ইন্টারনেট বা SMS গেটওয়ের সমস্যা।"}}
}
async function sendOtp(from2){
  const mid=from2?"m2":"m1",raw=from2&&cur?cur.phone:$("ph").value,d=norm10(raw);
  if(!d){setMsg("m1","সঠিক মোবাইল নাম্বার লিখুন (যেমন 01XXXXXXXXX)।");return}
  if(!(window.crypto&&crypto.subtle)){setMsg(mid,"এই ব্রাউজারে চলবে না। https লিংকে খুলুন।");return}
  const b1=$("b1"),rs=$("resend");b1.disabled=true;if(from2)rs.disabled=true;setMsg(mid,"যাচাই হচ্ছে…",true);
  try{
    const key=await sha("jdc-staff:"+d);
    let rec=null;
    try{const r=await fetch(DB+"/staffPortal/"+key+".json",{cache:"no-store"});if(!r.ok)throw 0;rec=await r.json()}
    catch(e){setMsg(mid,"সংযোগে সমস্যা হয়েছে। ইন্টারনেট দেখে আবার চেষ্টা করুন।");if(from2)rs.disabled=false;return}
    if(!rec){setMsg(mid,"এই নাম্বারে কোনো স্টাফ পাওয়া যায়নি। অফিসে যোগাযোগ করুন।");if(from2)rs.disabled=false;return}
    if(!rateOK(key)){setMsg(mid,"এক ঘণ্টায় সর্বোচ্চ ৩ বার OTP নেওয়া যায়। পরে আবার চেষ্টা করুন।");return}
    let q=null;try{const r=await fetch(DB+"/stock/qsms.json",{cache:"no-store"});q=await r.json()}catch(e){}
    if(!q||!q.encKey||!q.encSecret||q.enabled===false){setMsg(mid,"এখন OTP পাঠানো যাচ্ছে না। অফিসে যোগাযোগ করুন।");return}
    const otp=String(100000+(crypto.getRandomValues(new Uint32Array(1))[0]%900000));
    const res=await smsSend(q,"0"+d,"জনকল্যাণ ডায়াগনস্টিক\nআপনার OTP: "+otp+"\n৫ মিনিট বৈধ। কাউকে জানাবেন না।");
    if(!res.ok){setMsg(mid,res.msg);if(from2)rs.disabled=false;return}
    const salt=hex(crypto.getRandomValues(new Uint8Array(8)));
    cur={phone:"0"+d,rec,salt,h:await sha(otp+":"+salt),exp:Date.now()+300000,tries:0};
    $("s2t").textContent="০"+toBn(d.slice(0,1))+"•••••"+toBn(d.slice(-4))+" নাম্বারে OTP পাঠানো হয়েছে। ৫ মিনিট পর্যন্ত বৈধ।";
    $("otp").value="";setMsg("m1","");setMsg("m2","");show("s2");coolDown();$("otp").focus();
  }finally{b1.disabled=false}
}
async function verify(){
  const c=$("otp").value.trim();
  if(!cur){show("s1");return}
  if(!/^\d{6}$/.test(c)){setMsg("m2","৬ সংখ্যার OTP লিখুন।");return}
  if(Date.now()>cur.exp){cur=null;show("s1");setMsg("m1","OTP-র মেয়াদ শেষ। নতুন OTP নিন।");return}
  if(++cur.tries>5){cur=null;show("s1");setMsg("m1","অনেকবার ভুল হয়েছে। নতুন OTP নিন।");return}
  if(await sha(c+":"+cur.salt)!==cur.h){setMsg("m2","OTP ঠিক নয়। বাকি চেষ্টা: "+(6-cur.tries));return}
  const rec=cur.rec;rec.phone=cur.phone;cur=null;showResult(rec);
}
function showResult(r){
  show("s3");
  $("wp").style.display=r.photo?"":"none";if(r.photo)$("wp").src=r.photo;
  $("wn").textContent=r.name;$("wr").textContent=(r.role||"")+(r.sid?" • "+r.sid:"");
  const resigned=!!r.resigned;
  $("wk").textContent=resigned?"আপনার চাকরি সমাপ্তি সনদ নিচে দেওয়া হলো।":"আপনার স্টাফ আইডি কার্ড (সামনে ও পেছনে) নিচে দেওয়া হলো।";
  $("doc").innerHTML=resigned?'<div class="certwrap">'+certHTML(r)+'</div>':'<div class="idwrap">'+cardHTML(r)+'</div>';
  window.scrollTo(0,0);
}
$("b1").onclick=()=>sendOtp(false);
$("ph").addEventListener("keydown",e=>{if(e.key==="Enter")sendOtp(false)});
$("b2").onclick=verify;
$("otp").addEventListener("keydown",e=>{if(e.key==="Enter")verify()});
$("resend").onclick=()=>sendOtp(true);
$("chg").onclick=()=>{cur=null;clearInterval(cool);setMsg("m2","");show("s1")};
$("pr").onclick=()=>window.print();
$("lo").onclick=()=>{$("doc").innerHTML="";$("ph").value="";show("s1");setMsg("m1","")};
})();
</script>
